version: "3.9"
name: docker

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

  rag-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rag-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data          # PDFs + ChromaDB persist on host
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=llama3:instruct
      - VISION_MODEL=llava
      - EMBED_MODEL=nomic-embed-text
      - DATA_DIR=/app/data/pdfs
      - CHROMA_DIR=/app/data/chroma
      - RERANK_ENABLED=true
      - RERANK_CANDIDATES=20
      - FIGURE_DETECTION_ENABLED=false
      - PYTHONUNBUFFERED=1
    depends_on:
      ollama:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ollama_data:
